<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everything you said</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --paper:#EFEDE6; --card:#FAF9F6; --line:#DCD7CA; --ink:#241C33;
    --soft:#413B31; --muted:#6B6558; --faint:#9A9384; --accent:#8A5A00;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.6; }
  h1,h2 { font-family:'Newsreader',serif; font-weight:400; margin:0; }
  button { font-family:inherit; border:none; cursor:pointer; background:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .wrap { max-width:1060px; margin:0 auto; padding:26px 20px 70px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:4px; }
  .in { width:100%; font:inherit; font-size:14px; color:var(--ink); background:var(--card);
        border:1px solid var(--line); border-radius:3px; padding:9px 11px; }
  .in::placeholder { color:var(--faint); }
  .grid { display:grid; grid-template-columns:320px 1fr; gap:24px; }
  @media (max-width:800px){ .grid{grid-template-columns:1fr} .side{position:static!important} }
  .primary { background:var(--ink); color:var(--card); padding:8px 16px; border-radius:3px;
             font-size:13px; font-weight:500; }
  .primary:disabled { background:#C9C4B6; cursor:default; }
  .secondary { background:#E5E1D6; color:#4A4437; padding:8px 12px; border-radius:3px;
               font-size:13px; font-weight:500; }
  .chip { font-size:12.5px; font-weight:500; padding:5px 10px; border-radius:3px; }
  .entry { padding:14px; border-radius:0; }
  .entry h2 { font-size:18px; font-weight:500; line-height:1.3; cursor:pointer; }
  .tag { color:var(--muted); font-size:12px; padding:0; }
  .link-row { display:block; width:100%; text-align:left; padding:4px 0; border-bottom:1px solid var(--paper); }
  @media (prefers-reduced-motion:no-preference){ .pulse{animation:p 1.4s ease-in-out infinite} }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
  #map { touch-action:none; overflow:hidden; padding:0; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const TYPES = {
  idea:{label:"Idea",hue:"#8A5A00",bg:"#F6EBD2"},
  task:{label:"Task",hue:"#5B3A7E",bg:"#EDE4F5"},
  note:{label:"Note",hue:"#3F4B5B",bg:"#E3E8EE"},
  person:{label:"Person",hue:"#3F6B4A",bg:"#E0EDE2"},
  link:{label:"Link",hue:"#1F5E77",bg:"#DDEDF3"},
  expense:{label:"Expense",hue:"#8C4426",bg:"#F7E4DA"},
  journal:{label:"Journal",hue:"#8A3C56",bg:"#F7E1E8"}
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const lc = s => String(s).toLowerCase().trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = n => Date.now() - n*86400000;

const SAMPLE = [
 {raw:"rally venue, do it at the college ground instead of the main chowk, students turn up there and we get the visuals without blocking traffic",
  title:"Rally at the college ground, not the chowk",type:"idea",
  summary:"Hold the rally at the college ground rather than the main chowk. Better student turnout and no traffic disruption.",
  tags:["rally","venue"],people:[],action_items:[],created:ago(14)},
 {raw:"ground permission and sound system for the rally, last time permission took nine days so we need to file this week",
  title:"File ground permission and book sound",type:"task",
  summary:"File the ground permission and book the sound system for the rally. Permission took nine days last time.",
  tags:["rally","venue","logistics"],people:[],
  action_items:["File ground permission this week","Book sound system"],created:ago(13)},
 {raw:"we need around sixty volunteers on rally day just for crowd handling and water, ward twelve should send twenty of them",
  title:"Sixty volunteers needed on rally day",type:"task",
  summary:"Rally day needs roughly 60 volunteers for crowd handling and water, with about 20 expected from Ward 12.",
  tags:["rally","volunteers","logistics"],people:[],
  action_items:["Confirm 20 volunteers from Ward 12 for rally day"],created:ago(12)},

 {raw:"booth level volunteers in ward twelve are only fourteen people, we need at least forty before polling day, weakest ward right now",
  title:"Ward 12 is short on booth volunteers",type:"note",
  summary:"Ward 12 has 14 booth-level volunteers against a target of 40 before polling day, making it the weakest ward.",
  tags:["booth","volunteers","ward-12"],people:[],action_items:[],created:ago(10)},
 {raw:"gurpreet should run a training session for the new booth volunteers, half of them have never done polling day duty",
  title:"Booth volunteer training with Gurpreet",type:"task",
  summary:"Arrange a training session with Gurpreet for new booth volunteers, many of whom have never worked a polling day.",
  tags:["booth","volunteers","training"],people:["Gurpreet"],
  action_items:["Schedule booth volunteer training with Gurpreet"],created:ago(9)},
 {raw:"make a whatsapp group for all booth in charges before friday, we keep losing information in individual calls",
  title:"WhatsApp group for booth in-charges",type:"task",
  summary:"Create a WhatsApp group for all booth in-charges before Friday to stop losing information across individual calls.",
  tags:["booth","volunteers","outreach"],people:[],
  action_items:["Set up booth in-charge group by Friday"],created:ago(8)},

 {raw:"at the mandi this morning farmers kept coming back to payment delays, not msp, the gap between sale and money reaching the account is what they actually raised",
  title:"Farmers raised payment delays, not MSP",type:"note",
  summary:"At the mandi, farmers repeatedly raised the delay between sale and payment reaching their accounts rather than MSP itself.",
  tags:["manifesto","field","farmers"],people:[],action_items:[],created:ago(6)},
 {raw:"drainage in the old city floods every monsoon and nobody has costed a fix, if we put an actual number on it that is more credible than a promise",
  title:"Put a number on the drainage fix",type:"idea",
  summary:"Cost the old city drainage fix, which floods each monsoon. A specific figure reads as more credible than a promise.",
  tags:["manifesto","field","ward-12"],people:[],action_items:[],created:ago(5)},
 {raw:"use the rally speech to lead with the two things people actually raised in the field, payment delays and drainage, not the standard list",
  title:"Lead the rally speech with field issues",type:"idea",
  summary:"Build the rally speech around the two issues raised most in the field, payment delays and drainage, instead of the standard list.",
  tags:["rally","manifesto","field"],people:[],action_items:[],created:ago(3)}
];

// Storage: artifact storage if present, else localStorage, else memory. The
// prototype has to survive being opened from a file:// path, a static host,
// or an artifact panel without changing behaviour.
const store = {
  mem:null,
  async get(){
    try { if (window.storage) { const r = await window.storage.get("brain"); return r&&r.value?JSON.parse(r.value):null; } } catch(e){}
    try { const v = localStorage.getItem("brain"); return v?JSON.parse(v):null; } catch(e){}
    return this.mem;
  },
  async set(v){
    this.mem = v;
    try { if (window.storage) { await window.storage.set("brain", JSON.stringify(v)); return; } } catch(e){}
    try { localStorage.setItem("brain", JSON.stringify(v)); } catch(e){}
  }
};

let S = { entries:[], started:false, view:"stream", filter:"all", query:"", sel:null,
          draft:"", busy:false, listening:false, notice:"", online:true };

// ---- extraction -----------------------------------------------------------
// Tries the hosted model first. When there's no API available — a plain static
// host, a file:// open — it falls back to a local heuristic so the demo still
// works end to end. Degraded, and labelled as such, beats a dead button.

const EXTRACT_PROMPT = `Turn this raw personal capture into one structured record.
Return ONLY JSON: {"title":"under 8 words","type":"idea|task|note|person|link|expense|journal","summary":"1-3 clean sentences, fix grammar, invent nothing","tags":["2-5 lowercase topics"],"people":["names"],"action_items":["imperative phrases if actionable"]}
"task" only if they must DO something. "idea" for proposals and hypotheses. "expense" if money moved. "journal" for reflection. "note" is the fallback.
Reuse an existing tag whenever it fits — inventing a synonym leaves notes unconnected forever.`;

async function callModel(prompt, maxTokens){
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,
      messages:[{role:"user",content:prompt}]})
  });
  if(!res.ok) throw new Error("api "+res.status);
  const d = await res.json();
  return (d.content||[]).map(b=>b.text||"").join("\n");
}

const STOP = new Set("the a an and or but so if then than that this these those i we you he she it they me my our your of to in on at for with about from into over after before is are was were be been being do does did have has had will would can could should not no yes just really very actually honestly like need want think thinking feel today tomorrow yesterday".split(" "));

function localExtract(raw, known){
  const words = raw.toLowerCase().replace(/[^a-z0-9\s₹]/g," ").split(/\s+/).filter(Boolean);
  let type = "note";
  if (/\b(need to|should|remind|ask |todo|must |have to|follow up)\b/i.test(raw)) type = "task";
  else if (/\b(idea|what if|maybe we|we could|thinking we|instead of)\b/i.test(raw)) type = "idea";
  else if (/[₹$]\s?\d|\b\d+\s?(rupees|rs|dollars)\b/i.test(raw)) type = "expense";
  else if (/\b(feel|felt|tired|lonely|anxious|happy|frustrated|worst)\b/i.test(raw)) type = "journal";

  const hit = known.filter(k => raw.toLowerCase().includes(k));
  const freq = {};
  words.forEach(w => { if(!STOP.has(w) && w.length>3) freq[w]=(freq[w]||0)+1; });
  const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const tags = [...new Set([...hit, ...top])].slice(0,4);

  const people = (raw.match(/\b[A-Z][a-z]{2,}\b/g)||[])
    .filter(w => !/^(I|The|So|And|But|We|My|This|That)$/.test(w)).slice(0,3);

  const first = raw.split(/[.!?]/)[0].trim();
  return {
    title: first.split(/\s+/).slice(0,7).join(" ").replace(/^\w/,c=>c.toUpperCase()),
    type, summary: first.charAt(0).toUpperCase()+first.slice(1)+(first.endsWith(".")?"":"."),
    tags, people, action_items: type==="task" ? [first] : []
  };
}

async function extract(raw){
  const known = [...new Set(S.entries.flatMap(e=>e.tags||[]))].slice(0,40);
  try {
    const out = await callModel(`${EXTRACT_PROMPT}\n\nExisting tags: ${known.join(", ")||"none"}\n\nCapture:\n"""${raw}"""`, 700);
    const clean = out.replace(/```json|```/g,"").trim();
    const rec = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}")+1));
    if(!TYPES[rec.type]) rec.type="note";
    S.online = true;
    return rec;
  } catch(e) {
    S.online = false;
    return localExtract(raw, known);
  }
}

// ---- graph ----------------------------------------------------------------

function buildGraph(entries){
  const nodes = entries.map(e=>({id:e.id,e:e}));
  const links = [];
  for(let i=0;i<entries.length;i++) for(let j=i+1;j<entries.length;j++){
    const a=entries[i], b=entries[j];
    const at=new Set((a.tags||[]).map(lc)), ap=new Set((a.people||[]).map(lc));
    const shared=[...new Set([
      ...(b.tags||[]).filter(t=>at.has(lc(t))),
      ...(b.people||[]).filter(p=>ap.has(lc(p)))
    ])];
    if(shared.length) links.push({source:a.id,target:b.id,shared:shared,weight:shared.length});
  }
  const deg={};
  links.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1;deg[l.target]=(deg[l.target]||0)+1;});
  nodes.forEach(n=>{n.deg=deg[n.id]||0;n.r=8+Math.min(10,n.deg*2);});
  return {nodes:nodes,links:links};
}

function linksOf(id){
  const g = buildGraph(S.entries);
  return g.links
    .filter(l=>l.source===id||l.target===id)
    .map(l=>({other:S.entries.find(e=>e.id===(l.source===id?l.target:l.source)), shared:l.shared}))
    .filter(x=>x.other)
    .sort((a,b)=>b.shared.length-a.shared.length);
}

// ---- actions --------------------------------------------------------------

async function persist(next){ S.entries=next; await store.set(next); render(); }
async function seed(){ S.started=true; await persist(SAMPLE.map(s=>Object.assign({},s,{id:uid()}))); }
async function startEmpty(){ S.started=true; await persist([]); }
async function reset(){
  if(!confirm("Clear every note and start over?")) return;
  S.started=false; S.sel=null; await persist([]);
}

async function save(){
  const raw = S.draft.trim();
  if(!raw || S.busy) return;
  if(S.listening) stopVoice();
  S.busy=true; S.notice=""; render();
  const rec = await extract(raw);
  if(!S.online) S.notice="Filed locally — no model available on this host, so the title and tags are rough.";
  await persist([Object.assign({id:uid(),raw:raw,created:Date.now(),tags:[],people:[],action_items:[]},rec), ...S.entries]);
  S.draft=""; S.busy=false; render();
}

let recog=null;
function stopVoice(){ if(recog) recog.stop(); S.listening=false; }
function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ S.notice="This browser has no speech recognition — try Chrome, or type instead."; render(); return; }
  if(S.listening){ stopVoice(); render(); return; }
  const r = new SR();
  r.continuous=true; r.interimResults=true; r.lang="en-IN";
  const base = S.draft.trim();
  let settled="";
  r.onresult = e => {
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) settled+=t+" "; else interim+=t;
    }
    const spoken=(settled+interim).trim();
    S.draft = base ? (base+" "+spoken).trim() : spoken;
    const ta=document.getElementById("draft"); if(ta) ta.value=S.draft;
    syncSave();
  };
  r.onerror = () => { S.listening=false; S.notice="Microphone stopped. Check permissions."; render(); };
  r.onend = () => { S.listening=false; render(); };
  recog=r; r.start(); S.listening=true; render();
}

function syncSave(){
  const b = document.getElementById("saveBtn");
  if(b) b.disabled = S.busy || !S.draft.trim();
}

function setType(id,type){ persist(S.entries.map(e=>e.id===id?Object.assign({},e,{type:type}):e)); }
function remove(id){ S.sel=null; persist(S.entries.filter(e=>e.id!==id)); }
function toggle(id){ S.sel = S.sel===id?null:id; render(); }
function setView(v){ S.view=v; render(); }
function setFilter(f){ S.filter = S.filter===f?"all":f; render(); }
function setQuery(v){ S.query=v; render(); const s=document.getElementById("search"); if(s){s.value=v;} }
function dismiss(){ S.notice=""; render(); }

// ---- render ---------------------------------------------------------------

function when(ts){
  const d=new Date(ts);
  return d.toDateString()===new Date().toDateString()
    ? d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})
    : d.toLocaleDateString([],{day:"numeric",month:"short"});
}

function linkListHTML(items){
  if(!items.length) return `<p style="font-size:13px;color:var(--faint);margin:10px 0 0">Nothing else touches this yet.</p>`;
  return `<div style="margin-top:10px">
    <p style="margin:0 0 5px;font-size:13px;color:var(--muted)">Connected to</p>
    ${items.map(x=>`<button class="link-row" onclick="toggle('${x.other.id}')">
      <span style="font-size:13.5px;color:#1F5E77">${esc(x.other.title)}</span>
      <span style="font-size:12px;color:var(--faint)"> — via ${esc(x.shared.join(", "))}</span>
    </button>`).join("")}
  </div>`;
}

function entryHTML(e){
  const t = TYPES[e.type]||TYPES.note;
  const open = S.sel===e.id;
  const rel = linksOf(e.id);
  return `<article class="card entry" style="border-left:3px solid ${t.hue}">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
      <h2 onclick="toggle('${e.id}')">${esc(e.title)}</h2>
      <span style="font-size:12px;color:var(--faint);white-space:nowrap">${when(e.created)}</span>
    </div>
    <p style="margin:7px 0 0;font-size:14px;color:var(--soft)">${esc(e.summary)}</p>
    ${(e.action_items||[]).length?`<ul style="margin:9px 0 0;padding-left:18px;font-size:13.5px;color:#5B3A7E">
      ${e.action_items.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center">
      <select onchange="setType('${e.id}',this.value)" style="font:inherit;font-size:12px;color:${t.hue};background:${t.bg};border:none;border-radius:3px;padding:3px 6px;cursor:pointer">
        ${Object.keys(TYPES).map(k=>`<option value="${k}" ${k===e.type?"selected":""}>${TYPES[k].label}</option>`).join("")}
      </select>
      ${(e.tags||[]).map(tg=>`<button class="tag" onclick="setQuery('${esc(tg)}')">#${esc(tg)}</button>`).join("")}
      ${rel.length?`<button onclick="toggle('${e.id}')" style="background:#E5E1D6;color:#4A4437;font-size:12px;padding:3px 8px;border-radius:3px">${rel.length} linked</button>`:""}
      <button onclick="toggle('${e.id}')" style="margin-left:auto;color:var(--accent);font-size:12px">${open?"Less":"More"}</button>
    </div>
    ${open?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid #E5E1D6;font-size:13px;color:var(--muted)">
      ${(e.people||[]).length?`<p style="margin:0 0 8px">People: ${esc(e.people.join(", "))}</p>`:""}
      ${e.raw?`<p style="margin:0 0 8px;font-style:italic">${esc(e.raw)}</p>`:""}
      ${linkListHTML(rel)}
      <button onclick="remove('${e.id}')" style="color:#8C4426;font-size:12px;margin-top:8px">Delete this note</button>
    </div>`:""}
  </article>`;
}

function render(){
  const app = document.getElementById("app");

  if(!S.started){
    app.innerHTML = `<div style="max-width:460px;margin:60px auto 0;text-align:center">
      <h1 style="font-size:32px">Everything you said</h1>
      <p style="font-size:15px;color:var(--muted);margin:10px 0 26px">
        Type it or say it — or start typing and finish out loud. It comes back titled,
        sorted and tagged, and wired to whatever you already said about the same thing.
      </p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="primary" style="padding:10px 18px;font-size:14px" onclick="seed()">Explore with sample notes</button>
        <button class="secondary" style="padding:10px 18px;font-size:14px" onclick="startEmpty()">Start empty</button>
      </div>
      <p style="font-size:12.5px;color:var(--faint);margin-top:22px">
        Prototype. Notes stay in this browser — nobody else sees them.
      </p>
    </div>`;
    return;
  }

  const g = buildGraph(S.entries);
  const counts = {};
  S.entries.forEach(e=>counts[e.type]=(counts[e.type]||0)+1);
  const q = S.query.trim().toLowerCase();
  const visible = S.entries.filter(e=>{
    if(S.filter!=="all" && e.type!==S.filter) return false;
    if(!q) return true;
    return (e.title+" "+e.summary+" "+(e.tags||[]).join(" ")+" "+e.raw).toLowerCase().includes(q);
  });
  const sel = S.entries.find(e=>e.id===S.sel);

  app.innerHTML = `
    <header style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <div>
        <h1 style="font-size:28px;letter-spacing:-0.01em">Everything you said</h1>
        <p style="margin:5px 0 0;font-size:13.5px;color:var(--muted)">${S.entries.length} notes · ${g.links.length} connections</p>
      </div>
      <button onclick="reset()" style="color:var(--faint);font-size:12.5px">Reset prototype</button>
    </header>

    ${S.notice?`<div style="margin-bottom:16px;padding:9px 12px;font-size:13px;background:#F6EBD2;border:1px solid #E0CDA0;border-radius:3px;display:flex;justify-content:space-between;gap:12px">
      <span>${esc(S.notice)}</span><button onclick="dismiss()" style="color:var(--accent);font-size:13px">Dismiss</button></div>`:""}

    <div class="grid">
      <div class="side" style="position:sticky;top:20px;align-self:start">
        <div class="card" style="padding:14px;margin-bottom:14px">
          <textarea id="draft" rows="5" onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter')save()" placeholder="${S.listening?"Listening — keep talking, or keep typing…":"Type the thought, or hit Speak and say it"}"
            oninput="S.draft=this.value;syncSave()"
            style="width:100%;border:none;background:none;resize:vertical;font:inherit;font-size:15px;line-height:1.55;color:var(--ink);outline:none">${esc(S.draft)}</textarea>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="${S.listening?"pulse":""}" onclick="startVoice()"
              style="background:${S.listening?"#8A3C56":"#E5E1D6"};color:${S.listening?"#fff":"#4A4437"};padding:8px 12px;border-radius:3px;font-size:13px;font-weight:500">
              ${S.listening?"Stop":"Speak"}</button>
            <button id="saveBtn" class="primary" style="flex:1" onclick="save()" ${S.busy||!S.draft.trim()?"disabled":""}>
              ${S.busy?"Filing…":"Save"}</button>
          </div>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <button class="chip" onclick="setFilter('all')" style="background:${S.filter==="all"?"#241C33":"#E5E1D6"};color:${S.filter==="all"?"#FAF9F6":"#241C33"}">All ${S.entries.length}</button>
          ${Object.keys(TYPES).filter(k=>counts[k]).map(k=>`
            <button class="chip" onclick="setFilter('${k}')"
              style="background:${S.filter===k?TYPES[k].hue:TYPES[k].bg};color:${S.filter===k?"#FAF9F6":TYPES[k].hue}">
              ${TYPES[k].label} ${counts[k]}</button>`).join("")}
        </div>
      </div>

      <div>
        <div style="display:flex;gap:10px;margin-bottom:12px;align-items:center">
          <div style="display:flex;background:#E5E1D6;border-radius:3px;padding:2px">
            ${["stream","map"].map(v=>`<button onclick="setView('${v}')"
              style="background:${S.view===v?"#FAF9F6":"transparent"};color:${S.view===v?"#241C33":"#6B6558"};padding:5px 14px;border-radius:2px;font-size:13px;font-weight:500;text-transform:capitalize">${v}</button>`).join("")}
          </div>
          ${S.view==="stream"?`<input id="search" class="in" placeholder="Search everything" value="${esc(S.query)}" oninput="S.query=this.value;renderList()" style="flex:1">`:""}
        </div>

        ${S.entries.length===0?`<div class="card" style="padding:28px;text-align:center">
          <h2 style="font-size:19px">Nothing filed yet</h2>
          <p style="font-size:14px;color:var(--muted);margin:8px auto 0;max-width:40ch">
            Type a thought and save it, or hit Speak and say it out loud. You can mix both in one note.</p></div>`:""}

        ${S.entries.length&&S.view==="map"?`
          <div id="map" class="card"></div>
          <p style="font-size:12.5px;color:var(--muted);margin:8px 2px 0">
            ${g.nodes.filter(n=>n.deg>0).length} of ${g.nodes.length} notes connected · ${g.links.length} links · drag to rearrange, tap to trace</p>
          ${sel?`<div class="card entry" style="margin-top:12px;border-left:3px solid ${(TYPES[sel.type]||TYPES.note).hue}">
            <h2 style="font-size:18px;font-weight:500">${esc(sel.title)}</h2>
            <p style="margin:6px 0 0;font-size:14px;color:var(--soft)">${esc(sel.summary)}</p>
            ${linkListHTML(linksOf(sel.id))}</div>`:""}
        `:""}

        ${S.entries.length&&S.view==="stream"?`<div id="list" style="display:flex;flex-direction:column;gap:10px">
          ${visible.length?visible.map(entryHTML).join(""):`<p style="font-size:14px;color:var(--muted)">Nothing matches that.</p>`}
        </div>`:""}
      </div>
    </div>`;

  if(S.view==="map" && S.entries.length) drawMap(g);
}

function renderList(){
  const q = S.query.trim().toLowerCase();
  const visible = S.entries.filter(e=>{
    if(S.filter!=="all" && e.type!==S.filter) return false;
    if(!q) return true;
    return (e.title+" "+e.summary+" "+(e.tags||[]).join(" ")+" "+e.raw).toLowerCase().includes(q);
  });
  const el = document.getElementById("list");
  if(el) el.innerHTML = visible.length?visible.map(entryHTML).join(""):`<p style="font-size:14px;color:var(--muted)">Nothing matches that.</p>`;
}

let sim=null, pos={};
function drawMap(g){
  const host = document.getElementById("map");
  const w = host.clientWidth || 640;
  const h = Math.max(340, Math.min(520, w*0.75));
  host.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#DCD7CA"/></pattern></defs>
    <rect width="${w}" height="${h}" fill="url(#grid)"/>
    <g id="edges"></g><g id="nodes"></g></svg>`;

  const svg = host.querySelector("svg");
  svg.onclick = () => { S.sel=null; render(); };

  g.nodes.forEach(n=>{ const p=pos[n.id]; if(p){n.x=p.x;n.y=p.y;} });
  if(sim) sim.stop();
  sim = d3.forceSimulation(g.nodes)
    .force("link", d3.forceLink(g.links).id(d=>d.id)
      .distance(d=>130-Math.min(60,d.weight*18))
      .strength(d=>Math.min(0.85,0.25+d.weight*0.18)))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(w/2,h/2))
    .force("collide", d3.forceCollide(d=>d.r+22))
    .alpha(0.9);

  const edges = d3.select(svg).select("#edges");
  const nodes = d3.select(svg).select("#nodes");

  const edgeSel = edges.selectAll("line").data(g.links).join("line")
    .attr("stroke","#B3AB98").attr("stroke-width",d=>Math.min(4,d.weight*1.3));

  const labelSel = edges.selectAll("text").data(g.links).join("text")
    .attr("font-size",10.5).attr("fill","#8A5A00").attr("text-anchor","middle")
    .style("pointer-events","none").style("font-family","Inter,sans-serif")
    .text(d=>d.shared.slice(0,2).join(" · ")).attr("opacity",0);

  const nodeG = nodes.selectAll("g").data(g.nodes).join("g").style("cursor","grab")
    .on("click",(ev,d)=>{ ev.stopPropagation(); S.sel = S.sel===d.id?null:d.id; render(); })
    .on("pointerenter",(ev,d)=>highlight(d.id))
    .on("pointerleave",()=>highlight(S.sel))
    .call(d3.drag()
      .on("start",(ev,d)=>{ sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
      .on("end",(ev,d)=>{ sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  nodeG.append("circle")
    .attr("r",d=>d.r)
    .attr("fill",d=>d.deg?(TYPES[d.e.type]||TYPES.note).hue:(TYPES[d.e.type]||TYPES.note).bg)
    .attr("stroke",d=>(TYPES[d.e.type]||TYPES.note).hue).attr("stroke-width",1.5);

  nodeG.append("text")
    .attr("text-anchor","middle").attr("font-size",11.5).attr("fill","#413B31")
    .style("pointer-events","none").style("font-family","Inter,sans-serif")
    .attr("dy",d=>d.r+14)
    .text(d=>d.e.title.length>24?d.e.title.slice(0,23)+"…":d.e.title);

  function highlight(id){
    if(!id){ nodeG.attr("opacity",1); edgeSel.attr("opacity",1); labelSel.attr("opacity",0); return; }
    const near=new Set([id]);
    g.links.forEach(l=>{ const a=l.source.id||l.source, b=l.target.id||l.target;
      if(a===id) near.add(b); if(b===id) near.add(a); });
    nodeG.attr("opacity",d=>near.has(d.id)?1:0.15);
    edgeSel.attr("opacity",d=>near.has(d.source.id)&&near.has(d.target.id)?1:0.1);
    labelSel.attr("opacity",d=>(d.source.id===id||d.target.id===id)?1:0);
  }

  sim.on("tick",()=>{
    g.nodes.forEach(n=>{
      n.x=Math.max(n.r+6,Math.min(w-n.r-6,n.x));
      n.y=Math.max(n.r+6,Math.min(h-n.r-18,n.y));
      pos[n.id]={x:n.x,y:n.y};
    });
    edgeSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
           .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    labelSel.attr("x",d=>(d.source.x+d.target.x)/2).attr("y",d=>(d.source.y+d.target.y)/2-5);
    nodeG.attr("transform",d=>`translate(${d.x},${d.y})`);
  });

  if(S.sel) highlight(S.sel);
}

(async function init(){
  const saved = await store.get();
  if(saved && saved.length){ S.entries=saved; S.started=true; }
  render();
})();
</script>
</body>
</html>
